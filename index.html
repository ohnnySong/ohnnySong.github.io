<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>超声波设备领域 · 目标公司舆情看板</title>
<style>
:root{
 --bg:#f7f8fa;--card:#fff;--text:#1a1a1a;--muted:#5f6368;--border:#e5e7eb;
 --accent:#1a73e8;--accent-bg:#e8f0fe;--pos:#d93025;--pos-bg:#fce8e6;
 --neg:#137333;--neg-bg:#e6f4ea;--neu:#5f6368;--neu-bg:#f1f3f4;
 --gold-tx:#b06000;--gold-bg:#fff8e1;--thead:#f8f9fa;
 font-family:var(--kimi-font-sans,"PingFang SC","Microsoft YaHei",sans-serif);
 color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
 font-family:var(--kimi-font-sans,"PingFang SC","Microsoft YaHei",sans-serif);
 font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
#app{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);max-width:1100px;margin:0 auto}

/* hero */
.hero{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;padding:16px 18px 13px;flex:none}
.hero h1{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:.3px}
.hero .sub{opacity:.85;font-size:11.5px}
.hero .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.hero .tag{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:1px 10px;font-size:11px}

/* tabs */
.tabs{flex:none;display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--border);padding:0 12px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
 font-size:13px;padding:9px 14px;cursor:pointer}
.tabs button.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.tabs button:hover{color:var(--text)}
.tabs .sp{flex:1}
.tabs .st{font-size:11px;color:var(--muted);align-self:center}
.tabs .pill{background:var(--pos);color:#fff;border-radius:10px;font-size:10px;padding:0 6px;margin-left:4px;font-weight:700}

/* pages */
.page{flex:1;padding:14px 16px 24px;display:none}
.page.on{display:block}

/* badges */
.b{display:inline-block;font-size:11px;padding:1px 8px;border-radius:4px;font-weight:600;line-height:1.7}
.b-pos{background:var(--pos-bg);color:var(--pos)}
.b-neg{background:var(--neg-bg);color:var(--neg)}
.b-neu{background:var(--neu-bg);color:var(--neu)}
.b-tier-A{background:var(--pos-bg);color:var(--pos)}
.b-tier-B{background:var(--gold-bg);color:var(--gold-tx)}
.b-tier-C{background:var(--neu-bg);color:var(--neu)}
.b-week{background:#e6f4ea;color:#137333}
.b-local{background:#e8f0fe;color:#1a56a0}

/* filter bar */
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:2px 11px;
 font-size:12px;color:var(--muted);cursor:pointer}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.chip:hover{border-color:var(--muted)}
.fbar .sep{width:1px;height:16px;background:var(--border);margin:0 4px}

/* kv */
.kvrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.kv{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 12px}
.kv .k{font-size:11px;color:var(--muted)}
.kv .v{font-size:18px;font-weight:600;margin:1px 0;font-variant-numeric:tabular-nums}
.kv .v.pos{color:var(--pos)} .kv .v.neg{color:var(--neg)}
.kv .d{font-size:10.5px;color:var(--muted)}

/* news card */
.news{background:#fff;border:1px solid var(--border);border-radius:9px;padding:12px 15px;margin-bottom:10px}
.news.fresh{border-color:#f9ab00;box-shadow:0 0 0 1px #f9ab00 inset}
.news .h{font-weight:600;font-size:13.5px;margin-bottom:5px;display:flex;gap:8px;align-items:flex-start}
.news .h a{color:var(--text);text-decoration:none;flex:1}
.news .h a:hover{color:var(--accent);text-decoration:underline}
.news dl{margin:6px 0 0;display:grid;grid-template-columns:66px 1fr;gap:3px 10px;font-size:12.5px}
.news dt{color:var(--muted);font-size:11.5px}
.news dd{margin:0}
.news .co-tag{background:var(--accent-bg);color:#1a56a0;border-radius:4px;font-size:11px;
 padding:0 7px;flex:none;font-weight:600;line-height:1.9}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13px}
.small{font-size:11.5px;color:var(--muted)}

/* action bar */
.abar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:5px 13px;
 font-size:12.5px;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1765cc}
.btn.sm{padding:2px 10px;font-size:11.5px;border-radius:5px}
.btn.green{background:var(--neg);border-color:var(--neg);color:#fff}
.abar .hint{font-size:11px;color:var(--muted)}

/* pending */
.pend-block{background:#fffdf5;border:1px solid #f9ab00;border-radius:9px;padding:11px 14px;margin-bottom:16px}
.pend-block h3{margin:0 0 8px;font-size:13px;color:var(--gold-tx)}
.pend-item{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 0;border-top:1px dashed #eee5c8}
.pend-item:first-of-type{border-top:none}
.pend-item .nm{font-weight:700;font-size:13px}
.pend-item .mt{font-size:11.5px;color:var(--muted);flex:1;min-width:200px}

/* profile */
.tier-block{margin-bottom:16px}
.tier-head{font-size:13px;font-weight:700;padding:5px 12px;border-radius:6px;margin-bottom:8px;color:#fff}
.tier-head.tier-A{background:#b06000}.tier-head.tier-B{background:#1a56a0}.tier-head.tier-C{background:#5f6368}
.co-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.co-card{background:#fff;border:1px solid var(--border);border-radius:9px;padding:12px 14px}
.co-card.fresh{border-color:#f9ab00;box-shadow:0 0 0 1px #f9ab00 inset;background:#fffdf5}
.co-head{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.co-name{font-weight:700;font-size:14px;flex:1}
.co-ctry{font-size:11px;color:var(--muted)}
.co-cat{font-size:11px;color:#1a56a0;margin-bottom:6px}
.co-dl{margin:0;display:grid;grid-template-columns:60px 1fr;gap:4px 10px;font-size:12px}
.co-dl dt{color:var(--muted);font-size:11.5px}
.co-dl dd{margin:0}
.co-ops{margin-top:8px;text-align:right}
.link-btn{background:none;border:none;color:var(--pos);font-size:11.5px;cursor:pointer;padding:0}
@media (max-width:640px){.co-grid{grid-template-columns:1fr}.kvrow{grid-template-columns:repeat(3,1fr)}}

/* modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.modal{background:#fff;border-radius:10px;width:min(560px,94vw);max-height:88vh;overflow:auto;padding:18px 20px}
.modal h3{margin:0 0 12px;font-size:15px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border);border-radius:6px;
 padding:5px 8px;font-size:12.5px;background:#fff}
.fld textarea{resize:vertical;min-height:44px}
.modal .ops{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.req{color:var(--pos)}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#202124;color:#fff;
 padding:8px 18px;border-radius:20px;font-size:12.5px;display:none;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="app">
 <div class="hero">
  <h1>超声波设备领域 · 目标公司舆情看板</h1>
  <div class="sub" id="sub">数据加载中…</div>
  <div class="tags" id="heroTags"></div>
 </div>
 <div class="tabs">
  <button id="tabBtnNews" class="on" type="button">舆情看板</button>
  <button id="tabBtnProfile" type="button">公司简介<span class="pill" id="pendPill" style="display:none"></span></button>
  <span class="sp"></span>
  <span class="st" id="statusText"></span>
 </div>

 <div class="page on" id="pageNews">
  <div class="fbar" id="tierFilter">
   <button class="chip on" data-tier="" type="button">全部</button>
   <button class="chip" data-tier="A" type="button">A 级</button>
   <button class="chip" data-tier="B" type="button">B 级</button>
   <button class="chip" data-tier="C" type="button">C 级</button>
   <span class="sep"></span>
   <button class="chip on" data-sent="" type="button">全部情绪</button>
   <button class="chip" data-sent="positive" type="button">正面</button>
   <button class="chip" data-sent="negative" type="button">负面</button>
   <button class="chip" data-sent="neutral" type="button">中性</button>
   <span class="sep"></span>
   <button class="chip" data-week="1" type="button">🔥 仅看近一周</button>
  </div>
  <div class="kvrow" id="kvRow"></div>
  <div id="newsList"></div>
 </div>

 <div class="page" id="pageProfile">
  <div class="abar">
   <button class="btn primary" id="btnAdd" type="button">＋ 手动添加企业</button>
   <button class="btn" id="btnImport" type="button">📤 Excel / CSV 批量导入</button>
   <button class="btn" id="btnTpl" type="button">⬇ 下载导入模板</button>
   <button class="btn" id="btnExport" type="button">💾 导出最新名单 JSON</button>
   <input type="file" id="fileInput" accept=".xlsx,.csv" style="display:none">
   <span class="hint">手动/批量添加先保存在本浏览器，导出 JSON 替换仓库 companies.json 后全端生效并进入每日舆情监控</span>
  </div>
  <div class="fbar" id="profileFilter">
   <button class="chip on" data-pf="" type="button">全部公司</button>
   <button class="chip" data-pf="week" type="button">🔥 近一周有舆情</button>
   <button class="chip" data-pf="local" type="button">本地新增</button>
  </div>
  <div class="pend-block" id="pendBlock" style="display:none">
   <h3>🔎 舆情自动发现的新企业（待确认）</h3>
   <div id="pendList"></div>
   <div class="small" style="margin-top:6px">「入库」加入公司名单并开始每日监控；「忽略」后不再提示。名单变更请用上方「导出最新名单 JSON」提交。</div>
  </div>
  <div id="profileList"></div>
 </div>
</div>

<div class="mask" id="mask">
 <div class="modal">
  <h3 id="modalTitle">手动添加企业</h3>
  <div class="fgrid">
   <div class="fld"><label>企业名称 <span class="req">*</span></label><input id="f_name" placeholder="如 Telsonic"></div>
   <div class="fld"><label>国家</label><input id="f_country" placeholder="如 瑞士"></div>
   <div class="fld"><label>评级</label><select id="f_tier"><option value="A">A · 重点标的</option><option value="B">B · 关注标的</option><option value="C" selected>C · 观察标的</option></select></div>
   <div class="fld"><label>设备分类</label><input id="f_category" placeholder="如 1 超声波焊接设备"></div>
   <div class="fld full"><label>企业网址</label><input id="f_website" placeholder="如 telsonic.com"></div>
   <div class="fld full"><label>财务情况</label><textarea id="f_finance"></textarea></div>
   <div class="fld full"><label>产品技术</label><textarea id="f_tech"></textarea></div>
   <div class="fld full"><label>市场渠道</label><textarea id="f_channel"></textarea></div>
   <div class="fld full"><label>公司背景</label><textarea id="f_background"></textarea></div>
  </div>
  <div class="ops">
   <button class="btn" id="btnCancel" type="button">取消</button>
   <button class="btn primary" id="btnSave" type="button">保存</button>
  </div>
 </div>
</div>
<div id="toast"></div>

<script>
"use strict";
var WEEK_DAYS = 7;
var DATA = {generatedAt:"加载中", windowDays:30, items:[]};
var COMPANIES = [];        // 仓库 companies.json + 本地新增合并后的名单
var PENDING = [];          // 自动发现待确认
var curTab = "news", fTier = "", fSent = "", fWeekOnly = false, pfMode = "";

var LS_LOCAL = "ud_local_companies_v1";
var LS_IGNORED = "ud_ignored_pending_v1";

function esc(s){ var d=document.createElement("div"); d.textContent=String(s==null?"":s); return d.innerHTML; }
function sentLabel(s){ return s==="positive"?"正面":(s==="negative"?"负面":"中性"); }
function sentClass(s){ return s==="positive"?"b-pos":(s==="negative"?"b-neg":"b-neu"); }
function kv(label, val, cls, d){ return '<div class="kv"><div class="k">'+esc(label)+'</div><div class="v '+(cls||'')+'">'+esc(val)+'</div><div class="d">'+esc(d||'')+'</div></div>'; }
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._tm); t._tm=setTimeout(function(){t.style.display="none";},2600); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"[]"); }catch(e){ return []; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function nameKey(n){ return String(n||"").trim().toLowerCase(); }

function isFresh(dateStr){
  if(!dateStr) return false;
  var t = Date.parse(dateStr+"T00:00:00");
  if(isNaN(t)) return false;
  return (Date.now()-t) <= WEEK_DAYS*86400000;
}

/* ---------- 数据合并 ---------- */
function mergeCompanies(base){
  var map = {};
  (base||[]).forEach(function(c){ map[nameKey(c.name)] = c; });
  lsGet(LS_LOCAL).forEach(function(c){
    var k = nameKey(c.name);
    if(map[k]) map[k] = Object.assign({}, map[k], c);   // 本地同名覆盖
    else map[k] = c;
  });
  COMPANIES = Object.keys(map).map(function(k){ return map[k]; });
}
function companyTier(name){
  for(var i=0;i<COMPANIES.length;i++) if(nameKey(COMPANIES[i].name)===nameKey(name)) return COMPANIES[i].tier;
  return "";
}
function freshCompanies(){
  var set = {}, cnt = {};
  ((DATA&&DATA.items)||[]).forEach(function(it){
    if(isFresh(it.date)){ set[it.company]=1; cnt[it.company]=(cnt[it.company]||0)+1; }
  });
  return {set:set, cnt:cnt};
}

/* ---------- 舆情页 ---------- */
function render(){
  var items = (DATA && DATA.items) || [];
  var pos=0,neg=0,neu=0; var cos={};
  items.forEach(function(it){ if(it.sentiment==="positive")pos++; else if(it.sentiment==="negative")neg++; else neu++; cos[it.company]=1; });
  var weekCnt = items.filter(function(it){return isFresh(it.date);}).length;
  var sub = document.getElementById("sub");
  if (sub) sub.textContent = COMPANIES.length + " 家监控公司 · 最近 " + (DATA.windowDays||30) + " 天舆情 · 更新于 " + (DATA.generatedAt||"—");
  var tags = document.getElementById("heroTags");
  if (tags) tags.innerHTML = '<span class="tag">正面 '+pos+'</span><span class="tag">负面 '+neg+'</span><span class="tag">中性 '+neu+'</span>'
    + '<span class="tag">🔥 近一周 '+weekCnt+'</span><span class="tag">有舆情公司 '+Object.keys(cos).length+'</span>';

  var kvRow = document.getElementById("kvRow");
  if (kvRow) kvRow.innerHTML = kv("舆情总数", items.length, "", "最近 "+(DATA.windowDays||30)+" 天")
    + kv("正面", pos, "pos", "订单/新品/合作/融资")
    + kv("负面", neg, "neg", "诉讼/亏损/召回/裁减")
    + kv("中性", neu, "", "常规动态")
    + kv("覆盖公司", Object.keys(cos).length, "", "无舆情公司不列入");

  var list = document.getElementById("newsList");
  if (!list) return;
  var shown = items.filter(function(it){
    if (fSent && it.sentiment!==fSent) return false;
    if (fTier && companyTier(it.company)!==fTier) return false;
    if (fWeekOnly && !isFresh(it.date)) return false;
    return true;
  });
  if (!shown.length) { list.innerHTML = '<div class="empty">该筛选条件下暂无舆情</div>'; return; }
  list.innerHTML = shown.map(function(it){
    var url = String(it.url||"#");
    var fresh = isFresh(it.date);
    return '<div class="news'+(fresh?' fresh':'')+'"><div class="h"><span class="co-tag">'+esc(it.company)+'</span>'
    + '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>'
    + (fresh?'<span class="b b-week">本周</span>':'')
    + '<span class="b '+sentClass(it.sentiment)+'">'+sentLabel(it.sentiment)+'</span></div>'
    + '<dl><dt>摘要</dt><dd>'+esc(it.summary)+'</dd>'
    + '<dt>判断理由</dt><dd>'+esc(it.reason)+'</dd>'
    + '<dt>来源</dt><dd><a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(it.source)+'</a>'+(it.date?' · '+esc(it.date):'')+'</dd></dl></div>';
  }).join("");
}

/* ---------- 公司简介页 ---------- */
function fieldRows(c){
  var rows = "";
  function row(k,v){ if(!v) return ""; return '<dt>'+k+'</dt><dd>'+esc(v).replace(/\n/g,"<br>")+'</dd>'; }
  rows += row("产品技术", c.tech);
  rows += row("财务情况", c.finance);
  rows += row("市场渠道", c.channel);
  rows += row("公司背景", c.background);
  if(c.website){
    var u = /^https?:\/\//i.test(c.website) ? c.website : "https://"+c.website;
    rows += '<dt>官网</dt><dd><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(c.website)+'</a></dd>';
  }
  return rows;
}

function renderProfile(){
  var host = document.getElementById("profileList");
  if(!host) return;
  var fc = freshCompanies();
  var tiers = [{t:"A",label:"A 级 · 重点标的"},{t:"B",label:"B 级 · 关注标的"},{t:"C",label:"C 级 · 观察标的"}];
  var html = "";
  tiers.forEach(function(T){
    var list = COMPANIES.filter(function(c){ return (c.tier||"C")===T.t; });
    list.sort(function(a,b){
      var fa = fc.set[a.name]?1:0, fb = fc.set[b.name]?1:0;
      if(fa!==fb) return fb-fa;
      return String(a.name).localeCompare(String(b.name));
    });
    if(pfMode==="week") list = list.filter(function(c){ return fc.set[c.name]; });
    if(pfMode==="local") list = list.filter(function(c){ return c.source==="manual"||c.source==="excel"||c.source==="auto"; });
    if(!list.length) return;
    html += '<div class="tier-block"><div class="tier-head tier-'+T.t+'">'+T.label+'（'+list.length+'）</div><div class="co-grid">';
    list.forEach(function(c){
      var fresh = !!fc.set[c.name];
      var isLocal = c.source==="manual"||c.source==="excel"||c.source==="auto";
      html += '<div class="co-card'+(fresh?' fresh':'')+'" data-name="'+esc(c.name)+'">'
        + '<div class="co-head"><span class="co-name">'+esc(c.name)+'</span><span class="co-ctry">'+esc(c.country||"")+'</span>'
        + (fresh?'<span class="b b-week">🔥 近7天舆情 '+(fc.cnt[c.name]||0)+' 条</span>':'')
        + (isLocal?'<span class="b b-local">本地新增</span>':'')
        + '<span class="b b-tier-'+(c.tier||"C")+'">'+esc(c.tier||"C")+'</span></div>'
        + (c.category?'<div class="co-cat">'+esc(c.category)+'</div>':'')
        + '<dl class="co-dl">'+fieldRows(c)+'</dl>'
        + (isLocal?'<div class="co-ops"><button class="link-btn" data-del="'+esc(c.name)+'" type="button">删除本地记录</button></div>':'')
        + '</div>';
    });
    html += '</div></div>';
  });
  host.innerHTML = html || '<div class="empty">没有符合条件的公司</div>';
}

/* ---------- 待确认 ---------- */
function visiblePending(){
  var ignored = {}; lsGet(LS_IGNORED).forEach(function(n){ ignored[nameKey(n)]=1; });
  var inList = {}; COMPANIES.forEach(function(c){ inList[nameKey(c.name)]=1; });
  return PENDING.filter(function(p){ return !ignored[nameKey(p.name)] && !inList[nameKey(p.name)]; });
}
function renderPending(){
  var items = visiblePending();
  var block = document.getElementById("pendBlock");
  var pill = document.getElementById("pendPill");
  if(pill){ pill.style.display = items.length?"":"none"; pill.textContent = items.length; }
  if(!block) return;
  if(!items.length){ block.style.display="none"; document.getElementById("pendList").innerHTML=""; return; }
  block.style.display = "";
  document.getElementById("pendList").innerHTML = items.map(function(p,i){
    return '<div class="pend-item"><span class="nm">'+esc(p.name)+'</span>'
      + (p.country?'<span class="small">'+esc(p.country)+'</span>':'')
      + '<span class="mt">'+esc(p.note||"")+(p.url?' · <a href="'+esc(p.url)+'" target="_blank" rel="noopener">来源新闻</a>':'')+(p.date?' · '+esc(p.date):'')+'</span>'
      + '<button class="btn sm green" data-acc="'+i+'" type="button">入库</button>'
      + '<button class="btn sm" data-ign="'+i+'" type="button">忽略</button></div>';
  }).join("");
}

/* ---------- 手动添加 ---------- */
function openModal(){ document.getElementById("mask").className="mask on"; }
function closeModal(){ document.getElementById("mask").className="mask"; }
function saveManual(){
  var name = document.getElementById("f_name").value.trim();
  if(!name){ toast("请填写企业名称"); return; }
  var rec = {
    name:name,
    country:document.getElementById("f_country").value.trim(),
    tier:document.getElementById("f_tier").value,
    category:document.getElementById("f_category").value.trim(),
    website:document.getElementById("f_website").value.trim(),
    finance:document.getElementById("f_finance").value.trim(),
    tech:document.getElementById("f_tech").value.trim(),
    channel:document.getElementById("f_channel").value.trim(),
    background:document.getElementById("f_background").value.trim(),
    source:"manual", addedAt:new Date().toISOString().slice(0,10)
  };
  upsertLocal([rec], "manual");
  closeModal();
  toast("已保存到本地名单：" + name);
}
function upsertLocal(recs, src){
  var local = lsGet(LS_LOCAL);
  var added=0, updated=0;
  recs.forEach(function(r){
    var k = nameKey(r.name), found=false;
    for(var i=0;i<local.length;i++){
      if(nameKey(local[i].name)===k){ local[i]=Object.assign({},local[i],r); found=true; updated++; break; }
    }
    if(!found){ local.push(r); added++; }
  });
  lsSet(LS_LOCAL, local);
  mergeCompanies(window._baseCompanies||[]);
  renderProfile(); renderPending(); render();
  return {added:added, updated:updated};
}

/* ---------- Excel / CSV 导入 ---------- */
var HEADER_MAP = {
  "类型":"tier","评级":"tier","tier":"tier",
  "国家":"country",
  "企业名称":"name","公司名称":"name","name":"name",
  "维度一：财务情况":"finance","财务情况":"finance",
  "维度二：产品技术":"tech","产品技术":"tech",
  "维度三：市场渠道":"channel","市场渠道":"channel",
  "维度四：公司背景":"background","公司背景":"background",
  "企业网址":"website","官网":"website","网址":"website",
  "设备分类":"category","分类":"category"
};
function normTier(v){
  v = String(v||"").trim().toUpperCase().slice(0,1);
  return (v==="A"||v==="B") ? v : "C";
}
function rowsToCompanies(rows){
  var out = [], skipped = 0;
  rows.forEach(function(row){
    var rec = {name:"",country:"",tier:"C",category:"",website:"",finance:"",tech:"",channel:"",background:""};
    Object.keys(row).forEach(function(h){
      var key = HEADER_MAP[String(h).trim()] || HEADER_MAP[String(h).trim().toLowerCase()];
      if(key) rec[key] = String(row[h]==null?"":row[h]).trim();
    });
    if(!rec.name){ skipped++; return; }
    rec.tier = normTier(rec.tier);
    rec.source = "excel";
    rec.addedAt = new Date().toISOString().slice(0,10);
    out.push(rec);
  });
  return {recs:out, skipped:skipped};
}
function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  var rows=[], row=[], cur="", q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cur); cur=""; }
      else if(ch==='\n'||ch==='\r'){
        if(ch==='\r'&&text[i+1]==='\n') i++;
        row.push(cur); cur="";
        if(row.length>1||row[0]!=="") rows.push(row);
        row=[];
      } else cur+=ch;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  if(rows.length<2) return [];
  var head = rows[0].map(function(h){return h.trim();});
  return rows.slice(1).map(function(r){
    var o={}; head.forEach(function(h,i){ o[h]=r[i]==null?"":r[i]; }); return o;
  });
}
function importFile(file){
  var done = function(rows){
    var r = rowsToCompanies(rows);
    if(!r.recs.length){ toast("未识别到有效企业行（跳过 "+r.skipped+" 行），请核对表头与模板一致"); return; }
    var res = upsertLocal(r.recs, "excel");
    toast("导入完成：新增 "+res.added+" 家，更新 "+res.updated+" 家，跳过无效 "+r.skipped+" 行");
  };
  if(/\.csv$/i.test(file.name)){
    var rd = new FileReader();
    rd.onload = function(){ done(parseCSV(String(rd.result||""))); };
    rd.readAsText(file, "utf-8");
  } else {
    loadXLSX(function(ok){
      if(!ok){ toast("xlsx 解析库加载失败（需联网），请另存为 CSV 后重试"); return; }
      var rd = new FileReader();
      rd.onload = function(){
        try{
          var wb = XLSX.read(rd.result, {type:"array"});
          var ws = wb.Sheets[wb.SheetNames[0]];
          done(XLSX.utils.sheet_to_json(ws, {defval:""}));
        }catch(e){ toast("xlsx 解析失败：" + e.message); }
      };
      rd.readAsArrayBuffer(file);
    });
  }
}
function loadXLSX(cb){
  if(window.XLSX) return cb(true);
  var CDNS = [
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
    "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js",
    "https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js",
    "https://lib.baomitu.com/xlsx/0.18.5/xlsx.full.min.js"
  ];
  var i = 0;
  function tryNext(){
    if(window.XLSX) return cb(true);
    if(i >= CDNS.length) return cb(false);
    var s = document.createElement("script");
    var settled = false;
    var tm = setTimeout(function(){ if(!settled){ settled=true; s.remove(); tryNext(); } }, 8000);
    s.onload = function(){ if(!settled){ settled=true; clearTimeout(tm); cb(true); } };
    s.onerror = function(){ if(!settled){ settled=true; clearTimeout(tm); s.remove(); tryNext(); } };
    s.src = CDNS[i++];
    document.head.appendChild(s);
  }
  tryNext();
}

/* ---------- 模板 / 导出 ---------- */
function download(filename, text, mime){
  var blob = new Blob([text], {type: mime||"text/plain;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function downloadTemplate(){
  var head = ["类型","国家","企业名称","维度一：财务情况","维度二：产品技术","维度三：市场渠道","维度四：公司背景","企业网址","设备分类"];
  var sample = ["C","德国","Example Ultrasonics GmbH","营收：1000万美元","超声波焊接设备","欧洲直销，亚洲代理","个人企业；无收并购记录","example-ultrasonics.de","1 超声波焊接设备"];
  function q(s){ s=String(s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
  var csv = "\uFEFF" + head.map(q).join(",") + "\n" + sample.map(q).join(",") + "\n";
  download("companies_import_template.csv", csv, "text/csv;charset=utf-8");
}
function exportCompanies(){
  var payload = {
    updatedAt: new Date().toISOString().slice(0,10),
    companies: COMPANIES.slice().sort(function(a,b){
      var o={A:0,B:1,C:2};
      return (o[a.tier||"C"]-o[b.tier||"C"]) || String(a.name).localeCompare(String(b.name));
    })
  };
  download("companies.json", JSON.stringify(payload, null, 1), "application/json;charset=utf-8");
  toast("已导出 companies.json，替换仓库同名文件并提交后全端生效");
}

  });
  document.getElementById("profileFilter").addEventListener("click", function(ev){
    var b = ev.target; if(!b || !b.getAttribute) return;
    var m = b.getAttribute("data-pf"); if(m===null) return;
    pfMode = m;
    this.querySelectorAll(".chip").forEach(function(c){ c.className="chip"+(c===b?" on":""); });
    renderProfile();
  });
  document.getElementById("btnAdd").addEventListener("click", openModal);
  document.getElementById("btnCancel").addEventListener("click", closeModal);
  document.getElementById("mask").addEventListener("click", function(ev){ if(ev.target===this) closeModal(); });
  document.getElementById("btnSave").addEventListener("click", saveManual);
  document.getElementById("btnImport").addEventListener("click", function(){ document.getElementById("fileInput").click(); });
  document.getElementById("fileInput").addEventListener("change", function(){
    if(this.files && this.files[0]) importFile(this.files[0]);

  });
  document.getElementById("btnTpl").addEventListener("click", downloadTemplate);
  document.getElementById("btnExport").addEventListener("click", exportCompanies);
  document.getElementById("pendList").addEventListener("click", function(ev){
    var b = ev.target; if(!b || !b.getAttribute) return;
    var acc = b.getAttribute("data-acc"), ign = b.getAttribute("data-ign");
    var items = visiblePending();
    if(acc!==null){
      var p = items[+acc]; if(!p) return;
      upsertLocal([{name:p.name, country:p.country||"", tier:"C", category:p.category||"",
        website:p.website||"", finance:"", tech:p.note||"", channel:"", background:"",
        source:"auto", addedAt:new Date().toISOString().slice(0,10)}], "auto");
      toast("已入库：" + p.name + "（评级默认 C，可导出后在 JSON 中调整）");
    } else if(ign!==null){
      var p2 = items[+ign]; if(!p2) return;
      var l = lsGet(LS_IGNORED); l.push(p2.name); lsSet(LS_IGNORED, l);
      renderPending();
    }
  });
  document.getElementById("profileList").addEventListener("click", function(ev){
    var b = ev.target; if(!b || !b.getAttribute) return;
    var del = b.getAttribute("data-del");
    if(del===null) return;
    var l = lsGet(LS_LOCAL).filter(function(c){ return nameKey(c.name)!==nameKey(del); });
    lsSet(LS_LOCAL, l);
    mergeCompanies(window._baseCompanies||[]);
    renderProfile(); render();
    toast("已删除本地记录：" + del);
  });
} catch(e){}

/* ---------- 数据加载 ---------- */
function loadJSON(url){
  return fetch(url + (url.indexOf("?")>=0?"&":"?") + "t=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; });
}

mergeCompanies([]);
render(); renderProfile(); renderPending();

Promise.all([loadJSON("companies.json"), loadJSON("data.json"), loadJSON("pending.json")]).then(function(rs){
  var cj = rs[0], dj = rs[1], pj = rs[2];
  window._baseCompanies = (cj && Array.isArray(cj.companies)) ? cj.companies : [];
  mergeCompanies(window._baseCompanies);
  if (dj && Array.isArray(dj.items)) DATA = dj;
  PENDING = (pj && Array.isArray(pj.items)) ? pj.items : [];
  render(); renderProfile(); renderPending();
  var st = document.getElementById("statusText");
  if(st){
    var localCnt = lsGet(LS_LOCAL).length;
    st.textContent = (window._baseCompanies.length? "" : "companies.json 未加载 · ") + (localCnt? "本地新增 "+localCnt+" 家未提交" : "");
  }
});
